<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverboyking Premises</title>
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        body { background: var(--dark); color: white; font-family: 'serif'; text-align: center; margin: 0; padding: 20px; }
        
        .header-logo { width: 140px; height: auto; margin: 10px 0; }

        .price-container {
            background: #151515;
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }

        .price-label { color: var(--gold); font-weight: bold; font-size: 0.9rem; }

        /* PORTFOLIO LAYOUT FOR 3 SAMPLES */
        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .sample-large { grid-column: span 2; } /* First image takes full width */
        
        .portfolio-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .cta-btn {
            background: var(--gold);
            color: black;
            padding: 18px;
            border-radius: 40px;
            display: block;
            margin-top: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }
    </style>
</head>
<body>

    <img src="logo1.png" alt="Silverboyking Logo" class="header-logo">
    
    <p style="color: var(--gold); letter-spacing: 3px; font-size: 0.8rem;">OFFICIAL PRICE LIST</p>

    <div class="price-container">
        <div class="price-row"><span class="price-label">MINIMUM</span><span>KSh 1,500</span></div>
        <div class="price-row"><span class="price-label">SMALL</span><span>1,500 - 2,500</span></div>
        <div class="price-row"><span class="price-label">MEDIUM</span><span>3,000 - 4,500</span></div>
        <div class="price-row"><span class="price-label">LARGE</span><span>5,000+</span></div>
        <div class="price-row"><span class="price-label">HALF SLEEVE</span><span>15k - 25k</span></div>
        <div class="price-row"><span class="price-label">FULL SLEEVE</span><span>35k - 40k</span></div>
    </div>

    <h3 style="color: var(--gold); margin-top: 30px; letter-spacing: 2px;">WORK SAMPLES</h3>
    <div class="portfolio-grid">
        <img src="sample1.jpg" class="sample-large">
        <img src="sample2.jpg">
        <img src="sample3.jpg">
    </div>

    <a href="#" class="cta-btn" onclick="copyAndBook()">BOOK NOW (COPY TILL)</a>

    <script>
        function copyAndBook() {
            const till = "0700032541";
            navigator.clipboard.writeText(till).then(() => {
                alert("Till 0700032541 Copied!");
                window.location.href = "https://wa.me/254700032541?text=Hi Silverboyking, I'd like to book a session.";
            });
        }
    </script>

</body>
</html>
