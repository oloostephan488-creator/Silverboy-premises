<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverboyking Premises</title>
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --gray: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: 'serif'; text-align: center; margin: 0; padding: 20px; line-height: 1.6; }
        
        /* Header Logo */
        .logo { width: 140px; height: auto; margin: 20px 0; border-radius: 10px; }

        /* Price Section */
        .prices {
            background: var(--gray);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .price-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        .label { color: var(--gold); font-weight: bold; font-size: 0.9rem; }

        /* Portfolio Grid (3 Samples) */
        .portfolio { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .portfolio img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }
        .first { grid-column: span 2; height: 220px !important; }

        /* Button */
        .cta {
            background: var(--gold);
            color: black;
            padding: 18px;
            border-radius: 40px;
            display: block;
            margin: 30px auto;
            text-decoration: none;
            font-weight: bold;
            width: 85%;
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3);
        }
    </style>
</head>
<body>

    <img src="logo1.png" alt="Logo" class="logo">
    
    <p style="color: var(--gold); letter-spacing: 3px; font-size: 0.8rem;">ESTABLISHED PREMISES</p>

    <div class="prices">
        <div class="price-row"><span class="label">MINIMUM CHARGE</span><span>KSh 1,500</span></div>
        <div class="price-row"><span class="label">SMALL TATTOO</span><span>1.5k - 2.5k</span></div>
        <div class="price-row"><span class="label">MEDIUM TATTOO</span><span>3k - 4.5k</span></div>
        <div class="price-row"><span class="label">LARGE TATTOO</span><span>5k+</span></div>
        <div class="price-row"><span class="label">HALF SLEEVE</span><span>15k - 25k</span></div>
        <div class="price-row"><span class="label">FULL SLEEVE</span><span>35k - 40k</span></div>
    </div>

    <h3 style="color: var(--gold); letter-spacing: 2px;">LATEST WORK</h3>
    <div class="portfolio">
        <img src="sample1.jpg" class="first">
        <img src="sample2.jpg">
        <img src="sample3.jpg">
    </div>

    <a href="#" class="cta" onclick="bookNow()">BOOK SESSION (COPY TILL)</a>

    <script>
        function bookNow() {
            const till = "0700032541";
            navigator.clipboard.writeText(till).then(() => {
                alert("Till Number 0700032541 Copied!");
                window.location.href = "https://wa.me/254700032541?text=Hi Silverboyking, I'm booking a session. I've copied your till number.";
            });
        }
    </script>

</body>
</html>
